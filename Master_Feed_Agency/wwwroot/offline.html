<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#226348" />
    <title>Offline - Master Feed Agency</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #dfe3d9; color: #212529; }
        .card { width: min(100%, 460px); background: #fff; border: 1px solid #bac3b2; border-radius: 16px; padding: 28px; box-shadow: 0 12px 30px rgba(0,0,0,.08); text-align: center; }
        .mark { width: 72px; height: 72px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 18px; background: #226348; color: #fff; font-size: 28px; font-weight: 800; }
        h1 { margin: 0 0 10px; font-size: 1.5rem; }
        p { margin: 0 0 20px; color: #6c757d; line-height: 1.55; }
        button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 8px; background: #226348; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">MF</div>
        <h1>Connection Nahi Hai</h1>
        <p>Internet ya server ka connection check karein, phir dobara koshish karein. Connection ke baghair sale ya payment save nahi hogi.</p>
        <button type="button" onclick="window.location.reload()">Dobara Koshish Karein</button>
    </main>
</body>
</html>
